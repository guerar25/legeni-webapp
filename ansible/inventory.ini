# Option A du sujet : une seule machine (WSL2 / VM) qui porte Jenkins ET Minikube.
# Pour l'option B (deux VM), remplacer les "localhost" par les adresses des VM :
#   [ci]  ci-vm  ansible_host=192.168.56.10 ansible_user=ubuntu
#   [k8s] k8s-vm ansible_host=192.168.56.11 ansible_user=ubuntu

[ci]
localhost

[k8s]
localhost

[all:vars]
ansible_connection=local
# Même interpréteur que ansible-playbook : c'est lui qui contient la bibliothèque "kubernetes"
# (indispensable dans le conteneur Jenkins, où Ansible tourne dans /opt/ansible)
ansible_python_interpreter="{{ ansible_playbook_python }}"
