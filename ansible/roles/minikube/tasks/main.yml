---
# Docker Desktop (WSL) dépose des liens symboliques vers ses propres outils, en lecture seule :
# on les remplace par de vrais binaires gérés ici.
- name: Repérer d'éventuels liens symboliques minikube / kubectl
  ansible.builtin.stat:
    path: "{{ minikube_bin_dir }}/{{ item }}"
  loop: [minikube, kubectl]
  register: minikube_bin_stat

- name: Supprimer ces liens symboliques
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ minikube_bin_stat.results | selectattr('stat.exists') | selectattr('stat.islnk') | list }}"
  loop_control:
    label: "{{ item.item }}"
  become: true

- name: Installer minikube et kubectl
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ minikube_bin_dir }}/{{ item.name }}"
    mode: "0755"
  loop:
    - name: minikube
      url: "https://github.com/kubernetes/minikube/releases/download/{{ minikube_version }}/minikube-linux-amd64"
    - name: kubectl
      url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: État du cluster
  ansible.builtin.command: "{{ minikube_bin_dir }}/minikube status --format {{ '{{.Host}}/{{.APIServer}}' }}"
  register: minikube_status
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ minikube_user }}"

- name: Démarrer le cluster (seulement s'il ne tourne pas)
  ansible.builtin.command: >-
    {{ minikube_bin_dir }}/minikube start --driver={{ minikube_driver }}
    --cpus={{ minikube_cpus }} --memory={{ minikube_memory }}
  when: minikube_status.stdout | trim != 'Running/Running'
  become: true
  become_user: "{{ minikube_user }}"

- name: Lister les addons actifs
  ansible.builtin.command: "{{ minikube_bin_dir }}/minikube addons list -o json"
  register: minikube_addons_json
  changed_when: false
  become: true
  become_user: "{{ minikube_user }}"

- name: Activer les addons manquants
  ansible.builtin.command: "{{ minikube_bin_dir }}/minikube addons enable {{ item }}"
  loop: "{{ minikube_addons }}"
  when: (minikube_addons_json.stdout | from_json)[item].Status != 'enabled'
  become: true
  become_user: "{{ minikube_user }}"

# Jenkins tourne dans un conteneur relié au réseau Docker "minikube" :
# il joint l'API sur l'IP interne du nœud (192.168.49.2:8443) et non sur le port publié en 127.0.0.1
- name: Lire le kubeconfig autonome du cluster
  ansible.builtin.command: "{{ minikube_bin_dir }}/kubectl config view --flatten --minify --context minikube"
  register: minikube_kubeconfig
  changed_when: false
  no_log: true
  become: true
  become_user: "{{ minikube_user }}"

- name: Adresse IP du nœud minikube
  ansible.builtin.command: "{{ minikube_bin_dir }}/minikube ip"
  register: minikube_ip
  changed_when: false
  become: true
  become_user: "{{ minikube_user }}"

- name: Exporter le kubeconfig pour Jenkins
  ansible.builtin.copy:
    dest: "{{ minikube_jenkins_kubeconfig }}"
    content: "{{ minikube_kubeconfig.stdout | regex_replace('server: https://[^\\n]+', 'server: https://' ~ (minikube_ip.stdout | trim) ~ ':8443') }}\n"
    owner: "{{ minikube_user }}"
    mode: "0600"
  no_log: true
  become: true
