---
jenkins_image: legeni/jenkins:lts          # image du TP 3.1 (Docker CLI, kubectl, Ansible, plugins)
jenkins_container: jenkins
jenkins_build_dir: /opt/jenkins-docker
# Volume qui contient TOUTE la configuration Jenkins (nom repris de l'installation compose du TP 3.1)
jenkins_volume: jenkins-docker_jenkins_home
jenkins_http_port: 8080
jenkins_agent_port: 50000
# "minikube" permet à Jenkins de joindre l'API Kubernetes (192.168.49.2:8443) depuis son conteneur
jenkins_networks:
  - name: jenkins
  - name: minikube
    # IP fixe : sinon, si Jenkins démarre avant minikube (redémarrage du PC), Docker peut lui donner
    # 192.168.49.2, l'adresse du nœud minikube -> "Address already in use" au démarrage du cluster
    ipv4_address: 192.168.49.100
# Notifications : serveur SMTP de test Mailpit (boîte de réception web sur http://localhost:8025)
jenkins_mail_enabled: true
mailpit_image: axllent/mailpit:v1.33.1
mailpit_container: mailpit
mailpit_web_port: 8025
jenkins_mail_smtp_host: "{{ mailpit_container }}"   # nom DNS du conteneur sur le réseau "jenkins"
jenkins_mail_smtp_port: 1025
